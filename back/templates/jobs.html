{% include 'partials/head.html' %}
<h2>Jobs</h2>
{% if not jobs %}<p class="muted">No jobs yet.</p>{% endif %}
<table>
  <tr><th>ID</th><th>Mode</th><th>Source</th><th>Status</th><th>Processed</th><th></th></tr>
  {% for j in jobs %}
  <tr>
    <td>{{ j.id }}</td>
    <td>{{ j.mode }}</td>
    <td>{{ j.source }}</td>
    <td><span class="badge {{ j.status }}">{{ j.status }}</span></td>
    <td>{{ j.processed }}/{{ j.total }}</td>
    <td><a href="/job/{{ j.id }}">open</a></td>
  </tr>
  {% endfor %}
</table>
{% include 'partials/tail.html' %}
